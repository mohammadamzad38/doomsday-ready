services:
  mongodb:
    image: mongo:7
    container_name: doomsday-ready-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
  backend:
    build: ./backend
    container_name: doomsday-ready-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      port: 3000
      MONGODB_URI: mongodb://localhost:27017/doomsday_ready
    depends_on:
      - mongodb
  frontend:
    build: ./frontend
    container_name: doomsday-ready-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000/api
    depends_on:
      - backend
volumes:
  mongo_data:
